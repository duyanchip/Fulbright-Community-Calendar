<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Fulbright Student Schedule - Community Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root { --h: 55px; --other-color: #007bff; --fuv-color: #ce0000; --border: #e2e8f0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .main-wrapper { max-width: 1600px; margin: auto; }
        
        .config-section { background: #2d3748; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .config-box { border-left: 3px solid #4a5568; padding-left: 15px; }
        .holiday-list { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
        .holiday-tag { background: #e53e3e; padding: 4px 10px; border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .holiday-tag span { cursor: pointer; font-weight: bold; }

        .input-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .input-panel { flex: 1; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid transparent; }
        .panel-other { border-top-color: var(--other-color); }
        .panel-fuv { border-top-color: var(--fuv-color); }
        
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #4a5568; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; }
        
        .btn { padding: 10px 15px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-util { background: #4a5568; margin: 0 5px; }
        .btn-google { background: #4285F4; }
        .btn-sync { background: #db4437; display: none; }

        .calendar-panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-x: auto; }
        .calendar { display: grid; grid-template-columns: 70px repeat(7, 1fr); border: 1px solid var(--border); background: white; min-width: 1100px; position: relative; }
        .head { background: #2d3748; color: white; text-align: center; padding: 12px 0; font-weight: bold; border-right: 1px solid #4a5568; }
        .time-row { height: var(--h); box-sizing: border-box; border-bottom: 1px solid var(--border); text-align: center; line-height: var(--h); font-size: 12px; background: #f7fafc; border-right: 1px solid var(--border); font-weight: bold; }
        .cell { height: var(--h); box-sizing: border-box; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; }
        .course-card { position: absolute; box-sizing: border-box; color: white; border-radius: 6px; padding: 6px; font-size: 11px; z-index: 10; box-shadow: 0 4px 8px rgba(0,0,0,0.15); cursor: pointer; overflow: hidden; line-height: 1.35; }

        .paste-box { background: #fff5f5; border: 1px dashed var(--fuv-color); border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .paste-box textarea { width: 100%; min-height: 90px; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-family: monospace; font-size: 11px; resize: vertical; }
        .parse-status { font-size: 12px; margin-top: 8px; line-height: 1.5; min-height: 1px; }
        .parse-status.ok { color: #22543d; background: #c6f6d5; padding: 8px; border-radius: 5px; }
        .parse-status.err { color: #742a2a; background: #fed7d7; padding: 8px; border-radius: 5px; }
        .manual-toggle { font-size: 13px; font-weight: bold; color: #718096; cursor: pointer; user-select: none; padding: 6px 0; margin-bottom: 8px; }
        .manual-toggle:hover { color: var(--fuv-color); }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="config-section">
        <div class="config-box">
            <h4>🗓 Thời gian Học kỳ</h4>
            <div style="display:flex; gap:10px;">
                <div>Bắt đầu: <input type="date" id="sem_start" onchange="saveDates()"></div>
                <div>Kết thúc: <input type="date" id="sem_end" onchange="saveDates()"></div>
            </div>
        </div>
        <div class="config-box">
            <h4>🌴 Ngày nghỉ (Né khi đồng bộ Google)</h4>
            <div style="display:flex; gap:10px; align-items: flex-end;">
                <div>Từ: <input type="date" id="hol_start"></div>
                <div>Đến: <input type="date" id="hol_end"></div>
                <button onclick="addHoliday()" style="padding: 8px 15px; background: #38a169; border: none; color: white; border-radius: 6px; cursor: pointer; height: 35px; margin-bottom: 10px;">+ Thêm</button>
            </div>
            <div class="holiday-list" id="hol_list"></div>
        </div>
    </div>

    <div class="input-row">
        <div class="input-panel panel-other">
            <h3 style="margin-top:0; color:var(--other-color)">🌟 Hoạt động khác</h3>
            <label>Tên hoạt động</label><input type="text" id="other_name" placeholder="VD: CLB Robot, Đi làm thêm...">
            <label>Thứ</label>
            <select id="other_day">
                <option value="2">Thứ 2</option><option value="3">Thứ 3</option><option value="4">Thứ 4</option>
                <option value="5">Thứ 5</option><option value="6">Thứ 6</option><option value="7">Thứ 7</option>
                <option value="8">Chủ Nhật</option>
            </select>
            <div style="display:flex; gap:10px">
                <div style="flex:1"><label>Bắt đầu (G:P)</label><div style="display:flex; align-items:center"><input type="number" id="other_startH" value="17">:<input type="number" id="other_startM" value="30"></div></div>
                <div style="flex:1"><label>Kết thúc (G:P)</label><div style="display:flex; align-items:center"><input type="number" id="other_endH" value="19">:<input type="number" id="other_endM" value="0"></div></div>
            </div>
            <label>Địa điểm</label><input type="text" id="other_room" placeholder="VD: Makerspace, Quận 7...">
            <button class="btn" style="background:var(--other-color); width:100%" onclick="addOther()">Thêm hoạt động</button>
        </div>

        <div class="input-panel panel-fuv">
            <h3 style="margin-top:0; color:var(--fuv-color)">🎓 Môn học Fulbright</h3>

            <div class="paste-box">
                <label style="color:var(--fuv-color)">⚡ Dán nhanh từ Student Portal</label>
                <textarea id="fuv_paste" placeholder="Bôi đen toàn bộ nội dung trang môn học trên Student Portal (Ctrl+A / Ctrl+C) rồi dán vào đây..."></textarea>
                <div style="display:flex; gap:8px; align-items:center; margin-top:8px">
                    <button class="btn" style="background:var(--fuv-color); flex:1" onclick="generateFromPaste()">✨ Generate</button>
                    <button class="btn" style="background:#718096" onclick="document.getElementById('fuv_paste').value=''; setParseStatus('')">Xóa ô</button>
                </div>
                <div id="parse_status" class="parse-status"></div>
            </div>

            <div class="manual-toggle" onclick="toggleManual()">
                <span id="manual_arrow">▸</span> Hoặc nhập tay
            </div>

            <div id="manual_fields" style="display:none">
            <label>Tên môn học</label><input type="text" id="fuv_name" placeholder="VD: Geopolitics, Ethics...">
            <label>Thứ</label>
            <select id="fuv_day">
                <option value="2">Thứ 2</option><option value="3">Thứ 3</option><option value="4">Thứ 4</option>
                <option value="5">Thứ 5</option><option value="6">Thứ 6</option><option value="7">Thứ 7</option>
                <option value="8">Chủ Nhật</option>
            </select>
            <div style="display:flex; gap:10px">
                <div style="flex:1"><label>Bắt đầu (G:P)</label><div style="display:flex; align-items:center"><input type="number" id="fuv_startH" value="9">:<input type="number" id="fuv_startM" value="0"></div></div>
                <div style="flex:1"><label>Kết thúc (G:P)</label><div style="display:flex; align-items:center"><input type="number" id="fuv_endH" value="11">:<input type="number" id="fuv_endM" value="0"></div></div>
            </div>
            <label>Phòng học</label><input type="text" id="fuv_room" placeholder="VD: Classroom 502">
            <button class="btn" style="background:var(--fuv-color); width:100%" onclick="addFUV()">Thêm môn FUV</button>
            </div>
        </div>
    </div>

    <div style="display:flex; justify-content: center; margin-bottom: 20px;">
        <button class="btn btn-util" style="background:#28a745" onclick="exportImg()">📸 Xuất ảnh lịch</button>
        <button id="auth_button" class="btn btn-util btn-google" onclick="handleAuthClick()">🔐 Đăng nhập Google</button>
        <button id="sync_button" class="btn btn-util" style="background:#db4437; display:none" onclick="syncToGoogle()">📅 Đồng bộ Google Calendar</button>
        <button id="ms_auth_button" class="btn btn-util" style="background:#0078d4" onclick="handleMsAuthClick()">🔐 Đăng nhập Outlook</button>
        <button id="ms_sync_button" class="btn btn-util" style="background:#0053a0; display:none" onclick="syncToOutlook()">📅 Đồng bộ Outlook Calendar</button>
        <button class="btn btn-util" style="background:#6b46c1" onclick="downloadICS()">📥 Tải file .ics</button>
        <button class="btn btn-util" onclick="resetSchedule()">🗑 Xóa sạch</button>
    </div>

    <div class="calendar-panel" id="captureRegion">
        <h2 style="text-align: center;">📅 Lịch Cá Nhân: Môn học & Hoạt động Fulbright</h2>
        <div class="calendar" id="grid"></div>
    </div>
</div>

<script>
    // --- THAY CLIENT_ID VÀ API_KEY CỦA BẠN TẠI ĐÂY ---
    const CLIENT_ID = '797711309974-dt663ma8idsuvap759rvavmfu0rdjt11.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyBDD_8nEquG7Le_XbLKgm7CElfue2C9X8Y';
    const SCOPES = "https://www.googleapis.com/auth/calendar.events";
    const DISCOVERY_DOC = "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";

    // ====== DÁN APPLICATION (CLIENT) ID TỪ AZURE VÀO ĐÂY ======
    const MS_CLIENT_ID = '866e9bdf-c3b3-4374-b50c-72ba5a7f6dfe';
    // "common" = khớp với lựa chọn "Any Entra ID Tenant + Personal Microsoft accounts"
    const MS_AUTHORITY = 'https://login.microsoftonline.com/common';
    // Để trống = tự tính theo URL đang mở. Điền cụ thể nếu muốn ép cứng một URL đã đăng ký.
    const MS_REDIRECT_URI = '';
    const MS_SCOPES = ["Calendars.ReadWrite"];
    const GRAPH_BASE = "https://graph.microsoft.com/v1.0";

    let schedule = [], holidays = [], tokenClient, gapiInited = false, gisInited = false;
    let msalInstance = null, msAccount = null;

    // --- MÀU NGẪU NHIÊN ---
    function generatePureRandomColor() {
        const letters = '0123456789ABC'; let color = '#';
        for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * letters.length)];
        return color;
    }

    // --- GOOGLE API ---
    function gapiLoaded() { gapi.load('client', async () => { await gapi.client.init({ apiKey: API_KEY, discoveryDocs: [DISCOVERY_DOC] }); gapiInited = true; }); }
    function gisLoaded() { tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' }); gisInited = true; }
    function handleAuthClick() {
        tokenClient.callback = (resp) => {
            if (resp.error !== undefined) throw (resp);
            document.getElementById('auth_button').innerHTML = '✅ Đã kết nối';
            document.getElementById('sync_button').style.display = 'inline-block';
        };
        tokenClient.requestAccessToken({prompt: (gapi.client.getToken() === null ? 'consent' : '')});
    }

    // --- ĐỒNG BỘ GOOGLE (CÓ NÉ NGÀY NGHỈ) ---
    async function syncToGoogle() {
        const semS = document.getElementById('sem_start').value, semE = document.getElementById('sem_end').value;
        if (!semS || !semE) return alert("Chọn ngày bắt đầu/kết thúc học kỳ!");
        const btn = document.getElementById('sync_button'); btn.innerText = "⏳ Đang đồng bộ...";
        try {
            for (let item of schedule) {
                const exDates = calculateExDates(item, semS, semE);
                const event = createCalendarEvent(item, exDates, semS, semE);
                await gapi.client.calendar.events.insert({ 'calendarId': 'primary', 'resource': event });
            }
            alert("Đã đồng bộ thành công (Loại trừ ngày nghỉ lễ)!");
        } catch (e) { alert("Lỗi: " + e.message); }
        btn.innerText = "📅 Đồng bộ Google Calendar";
    }

    function calculateExDates(item, semS, semE) {
        let exDates = [];
        let curr = new Date(semS), end = new Date(semE);
        const targetDay = (item.day - 1) % 7; 
        while (curr <= end) {
            if (curr.getDay() === targetDay) {
                const isOff = holidays.some(h => {
                    let hS = new Date(h.start), hE = new Date(h.end);
                    hS.setHours(0,0,0,0); hE.setHours(23,59,59,999);
                    return curr >= hS && curr <= hE;
                });
                if (isOff) {
                    let d = new Date(curr);
                    d.setHours(Math.floor(item.startH), (item.startH%1)*60, 0);
                    exDates.push(d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z');
                }
            }
            curr.setDate(curr.getDate() + 1);
        }
        return exDates;
    }

    function createCalendarEvent(item, exDates, semS, semE) {
        let firstDate = new Date(semS);
        const dayOfWeek = (item.day - 1) % 7;
        while(firstDate.getDay() !== dayOfWeek) firstDate.setDate(firstDate.getDate() + 1);
        const startDT = new Date(firstDate); startDT.setHours(Math.floor(item.startH), (item.startH%1)*60, 0);
        const endDT = new Date(startDT.getTime() + item.duration * 3600000);
        const recurrence = [`RRULE:FREQ=WEEKLY;UNTIL=${semE.replace(/-/g, '')}T235959Z`];
        if (exDates.length > 0) recurrence.push(`EXDATE;VALUE=DATE-TIME:${exDates.join(',')}`);
        return {
            'summary': item.name, 'location': item.room + " (" + item.info + ")",
            'start': { 'dateTime': startDT.toISOString(), 'timeZone': 'Asia/Ho_Chi_Minh' },
            'end': { 'dateTime': endDT.toISOString(), 'timeZone': 'Asia/Ho_Chi_Minh' },
            'recurrence': recurrence
        };
    }

    // ============ MICROSOFT / OUTLOOK ============
    // Thử lần lượt nhiều nguồn: CDN Microsoft (US West), CDN Microsoft (EU North), rồi npm mirror
    const MSAL_CDNS = [
        'https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js',
        'https://alcdn.msftauth.net/browser/2.35.0/js/msal-browser.min.js',
        'https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js',
        'https://unpkg.com/@azure/msal-browser@2.38.3/lib/msal-browser.min.js'
    ];

    function loadScriptOnce(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.async = true;
            s.onload = () => resolve();
            s.onerror = () => reject(new Error(src));
            document.head.appendChild(s);
        });
    }

    async function loadMsalLib() {
        if (typeof msal !== 'undefined') return true;
        for (const url of MSAL_CDNS) {
            try {
                await loadScriptOnce(url);
                if (typeof msal !== 'undefined') { console.log('MSAL tải được từ:', url); return true; }
            } catch (e) {
                console.warn('Không tải được MSAL từ:', e.message);
            }
        }
        return false;
    }

    async function ensureMsal() {
        if (msalInstance) return true;
        if (!MS_CLIENT_ID || MS_CLIENT_ID === 'YOUR_AZURE_APP_CLIENT_ID') {
            alert("Bạn chưa dán Application (client) ID vào biến MS_CLIENT_ID trong file.\n\nDùng nút '📥 Tải file .ics' cũng đồng bộ được mà không cần đăng nhập.");
            return false;
        }
        const ok = await loadMsalLib();
        if (!ok) {
            alert("Không tải được thư viện Microsoft (MSAL) từ bất kỳ nguồn nào.\n\nCó thể do mạng chặn CDN hoặc tiện ích chặn quảng cáo. Mở Console (F12) để xem chi tiết.\n\nTrong lúc chờ, nút '📥 Tải file .ics' vẫn dùng được bình thường.");
            return false;
        }
        msalInstance = new msal.PublicClientApplication({
            auth: {
                clientId: MS_CLIENT_ID,
                authority: MS_AUTHORITY,
                redirectUri: MS_REDIRECT_URI || (window.location.origin + window.location.pathname)
            },
            cache: { cacheLocation: 'localStorage' }
        });
        return true;
    }

    async function handleMsAuthClick() {
        if (!(await ensureMsal())) return;
        try {
            const res = await msalInstance.loginPopup({ scopes: MS_SCOPES, prompt: 'select_account' });
            msAccount = res.account;
            msalInstance.setActiveAccount(msAccount);
            document.getElementById('ms_auth_button').innerHTML = '✅ Đã kết nối Outlook';
            document.getElementById('ms_sync_button').style.display = 'inline-block';
        } catch (e) {
            alert("Đăng nhập Outlook thất bại: " + (e.message || e));
        }
    }

    async function getMsToken() {
        const req = { scopes: MS_SCOPES, account: msAccount };
        try {
            const r = await msalInstance.acquireTokenSilent(req);
            return r.accessToken;
        } catch (e) {
            const r = await msalInstance.acquireTokenPopup(req);
            return r.accessToken;
        }
    }

    async function graphFetch(token, path, method, body) {
        const opts = { method: method, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const resp = await fetch(GRAPH_BASE + path, opts);
        if (!resp.ok) {
            let msg = resp.status + ' ' + resp.statusText;
            try { const j = await resp.json(); if (j.error) msg = j.error.message; } catch (_) {}
            throw new Error(msg);
        }
        return resp.status === 204 ? null : resp.json();
    }

    async function syncToOutlook() {
        const semS = document.getElementById('sem_start').value, semE = document.getElementById('sem_end').value;
        if (!semS || !semE) return alert("Chọn ngày bắt đầu/kết thúc học kỳ!");
        if (!msAccount) return alert("Bạn cần đăng nhập Outlook trước!");
        const btn = document.getElementById('ms_sync_button');
        const label = "📅 Đồng bộ Outlook Calendar";
        btn.innerText = "⏳ Đang đồng bộ...";
        let totalRemoved = 0, done = 0;
        try {
            const token = await getMsToken();
            for (let item of schedule) {
                const created = await graphFetch(token, '/me/events', 'POST', createOutlookEvent(item, semS, semE));
                totalRemoved += await removeOutlookHolidayInstances(token, created.id, item, semS, semE);
                done++;
            }
            let msg = "Đã đồng bộ " + done + " môn lên Outlook Calendar!";
            if (totalRemoved > 0) msg += "\nĐã bỏ " + totalRemoved + " buổi trùng ngày nghỉ lễ.";
            alert(msg);
        } catch (e) { alert("Lỗi Outlook: " + (e.message || e)); }
        btn.innerText = label;
    }

    // Tạo event lặp hàng tuần theo định dạng Microsoft Graph
    function createOutlookEvent(item, semS, semE) {
        let firstDate = new Date(semS);
        const dayOfWeek = (item.day - 1) % 7; // 0=CN
        while (firstDate.getDay() !== dayOfWeek) firstDate.setDate(firstDate.getDate() + 1);

        const sh = Math.floor(item.startH), sm = Math.round((item.startH % 1) * 60);
        const startLocal = pad2(sh) + ':' + pad2(sm) + ':00';
        const endTotal = item.startH + item.duration;
        const eh = Math.floor(endTotal), em = Math.round((endTotal % 1) * 60);
        const endLocal = pad2(eh) + ':' + pad2(em) + ':00';
        const firstStr = isoDate(firstDate);

        const GRAPH_DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];

        return {
            subject: item.name,
            location: { displayName: item.room + " (" + item.info + ")" },
            start: { dateTime: firstStr + 'T' + startLocal, timeZone: 'SE Asia Standard Time' },
            end:   { dateTime: firstStr + 'T' + endLocal,   timeZone: 'SE Asia Standard Time' },
            recurrence: {
                pattern: { type: 'weekly', interval: 1, daysOfWeek: [GRAPH_DAYS[dayOfWeek]] },
                range: { type: 'endDate', startDate: firstStr, endDate: semE }
            }
        };
    }

    // Graph không hỗ trợ EXDATE -> lấy các instance trong khoảng học kỳ, xóa cái nào rơi vào ngày nghỉ
    async function removeOutlookHolidayInstances(token, seriesId, item, semS, semE) {
        if (!holidays.length) return 0;
        const startWin = semS + 'T00:00:00';
        const endWin = semE + 'T23:59:59';
        const path = '/me/events/' + seriesId + '/instances?startDateTime=' + encodeURIComponent(startWin)
                   + '&endDateTime=' + encodeURIComponent(endWin) + '&$top=200';
        let data;
        try { data = await graphFetch(token, path, 'GET'); }
        catch (_) { return 0; }
        let removed = 0;
        for (const inst of (data.value || [])) {
            const dstr = (inst.start && inst.start.dateTime) ? inst.start.dateTime.slice(0, 10) : null;
            if (!dstr) continue;
            const d = new Date(dstr + 'T00:00:00');
            const isOff = holidays.some(h => {
                let hS = new Date(h.start), hE = new Date(h.end);
                hS.setHours(0,0,0,0); hE.setHours(23,59,59,999);
                return d >= hS && d <= hE;
            });
            if (isOff) {
                try { await graphFetch(token, '/me/events/' + inst.id, 'DELETE'); removed++; }
                catch (_) {}
            }
        }
        return removed;
    }

    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function isoDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

    // ============ XUẤT FILE .ICS (chuẩn iCalendar RFC 5545) ============
    const ICS_DAYS = ['SU','MO','TU','WE','TH','FR','SA'];
    const TZID = 'Asia/Ho_Chi_Minh';

    function icsEscape(s) {
        return String(s == null ? '' : s)
            .replace(/\\/g, '\\\\').replace(/;/g, '\\;')
            .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    }

    // RFC 5545: dòng dài quá 75 octet phải gấp, dòng nối bắt đầu bằng 1 space.
    // Tính theo byte UTF-8 để không cắt giữa ký tự tiếng Việt.
    function icsFold(line) {
        const enc = new TextEncoder();
        let out = '', cur = '', bytes = 0;
        for (const ch of line) {
            const b = enc.encode(ch).length;
            if (bytes + b > 75) { out += cur + '\r\n '; cur = ''; bytes = 1; }
            cur += ch; bytes += b;
        }
        return out + cur;
    }

    function ymd(d) { return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }

    function hhmmss(hDec) {
        const h = Math.floor(hDec), m = Math.round((hDec % 1) * 60);
        return pad2(h) + pad2(m) + '00';
    }

    // UNTIL bắt buộc là UTC khi DTSTART có TZID -> quy đổi cuối ngày VN (+07:00) sang UTC
    function icsUntil(semE) {
        const d = new Date(semE + 'T23:59:59+07:00');
        return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T'
             + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
    }

    // 'YYYY-MM-DD' -> Date lúc 0h giờ địa phương (new Date('2026-09-02') bị hiểu là UTC)
    function localDate(s) {
        const p = String(s).slice(0, 10).split('-').map(Number);
        return new Date(p[0], p[1] - 1, p[2]);
    }

    function isHolidayDate(d) {
        return holidays.some(h => {
            const hS = localDate(h.start), hE = localDate(h.end);
            hE.setHours(23, 59, 59, 999);
            return d >= hS && d <= hE;
        });
    }

    function buildICS(semS, semE) {
        const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
        const L = [
            'BEGIN:VCALENDAR', 'VERSION:2.0',
            'PRODID:-//FUV Calendar//Lich ca nhan//VI',
            'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
            'X-WR-CALNAME:Lich hoc Fulbright',
            'X-WR-TIMEZONE:' + TZID,
            'BEGIN:VTIMEZONE', 'TZID:' + TZID,
            'BEGIN:STANDARD',
            'DTSTART:19700101T000000',
            'TZOFFSETFROM:+0700', 'TZOFFSETTO:+0700', 'TZNAME:+07',
            'END:STANDARD', 'END:VTIMEZONE'
        ];
        const until = icsUntil(semE);

        const lastDay = localDate(semE);

        schedule.forEach((item, idx) => {
            const dow = (item.day - 1) % 7;
            const first = localDate(semS);
            while (first.getDay() !== dow) first.setDate(first.getDate() + 1);

            const startStr = hhmmss(item.startH);
            const endStr = hhmmss(item.startH + item.duration);

            // Buổi đầu không được rơi vào ngày nghỉ: vài client hiểu sai khi EXDATE trùng DTSTART
            while (first <= lastDay && isHolidayDate(first)) first.setDate(first.getDate() + 7);
            if (first > lastDay) return; // cả học kỳ đều nghỉ -> bỏ qua môn này

            // Liệt kê các buổi còn lại rơi vào ngày nghỉ -> EXDATE (cùng TZID với DTSTART)
            const ex = [];
            const cur = new Date(first);
            while (cur <= lastDay) {
                if (isHolidayDate(cur)) ex.push(ymd(cur) + 'T' + startStr);
                cur.setDate(cur.getDate() + 7);
            }

            L.push('BEGIN:VEVENT');
            L.push('UID:fuv-' + idx + '-' + Math.floor(item.id) + '@fuv-calendar');
            L.push('DTSTAMP:' + stamp);
            L.push('DTSTART;TZID=' + TZID + ':' + ymd(first) + 'T' + startStr);
            L.push('DTEND;TZID=' + TZID + ':' + ymd(first) + 'T' + endStr);
            L.push('RRULE:FREQ=WEEKLY;UNTIL=' + until);
            if (ex.length) L.push('EXDATE;TZID=' + TZID + ':' + ex.join(','));
            L.push('SUMMARY:' + icsEscape(item.name));
            if (item.room) L.push('LOCATION:' + icsEscape(item.room));
            if (item.info) L.push('DESCRIPTION:' + icsEscape(item.info));
            L.push('END:VEVENT');
        });

        L.push('END:VCALENDAR');
        return L.map(icsFold).join('\r\n') + '\r\n';
    }

    function downloadICS() {
        const semS = document.getElementById('sem_start').value;
        const semE = document.getElementById('sem_end').value;
        if (!semS || !semE) return alert("Chọn ngày bắt đầu/kết thúc học kỳ trước đã!");
        if (new Date(semE) < new Date(semS)) return alert("Ngày kết thúc phải sau ngày bắt đầu!");
        if (!schedule.length) return alert("Lịch đang trống, chưa có gì để xuất.");

        const blob = new Blob([buildICS(semS, semE)], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'FUV-lich-hoc.ics';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // --- RENDER VÀ LOGIC NHẬP ---
    function initGrid() {
        const g = document.getElementById('grid');
        g.innerHTML = `<div class="head">Giờ</div><div class="head">T2</div><div class="head">T3</div><div class="head">T4</div><div class="head">T5</div><div class="head">T6</div><div class="head">T7</div><div class="head">CN</div>`;
        for(let h=6; h<=21; h++) { 
            g.innerHTML += `<div class="time-row">${h}:00</div>`; 
            for(let d=2; d<=8; d++) g.innerHTML += `<div class="cell" id="d${d}h${h}"></div>`; 
        }
    }

    function rowHeight() {
        const v = getComputedStyle(document.documentElement).getPropertyValue('--h');
        const n = parseFloat(v);
        return isNaN(n) ? 55 : n;
    }

    function render() {
        initGrid();
        const H = rowHeight();
        schedule.forEach(c => {
            const overlaps = schedule.filter(o => c.day === o.day && (c.startH < (o.startH + o.duration)) && (o.startH < (c.startH + c.duration)));
            const slot = document.getElementById(`d${c.day}h${Math.floor(c.startH)}`);
            if(!slot) return;
            const card = document.createElement('div'); card.className = 'course-card';
            card.style.height = (c.duration*H - 3)+'px'; card.style.top = ((c.startH%1)*H + 1)+'px';
            card.style.width = `calc(${100/overlaps.length}% - 6px)`; card.style.left = `calc(${overlaps.indexOf(c)*(100/overlaps.length)}% + 3px)`;
            card.style.backgroundColor = c.color;
            card.onclick = () => { if(confirm("Xóa môn này?")) { schedule = schedule.filter(i => i.id !== c.id); saveData(); render(); } };
            card.innerHTML = `<b>${c.name}</b><br>📍 ${c.room}<br><span style="font-size:9px">${c.info}</span>`;
            slot.appendChild(card);
        });
    }

    function addOther() {
        const hS = parseInt(document.getElementById('other_startH').value), mS = parseInt(document.getElementById('other_startM').value);
        const hE = parseInt(document.getElementById('other_endH').value), mE = parseInt(document.getElementById('other_endM').value);
        const sDec = hS + mS/60, eDec = hE + mE/60;
        schedule.push({ id: Date.now(), name: document.getElementById('other_name').value || "Activity", day: parseInt(document.getElementById('other_day').value), startH: sDec, duration: eDec - sDec, room: document.getElementById('other_room').value || "N/A", info: "Hoạt động", color: generatePureRandomColor() });
        saveData(); render();
    }

    function addFUV() {
        const hS = parseInt(document.getElementById('fuv_startH').value), mS = parseInt(document.getElementById('fuv_startM').value);
        const hE = parseInt(document.getElementById('fuv_endH').value), mE = parseInt(document.getElementById('fuv_endM').value);
        const sDec = hS + mS/60, eDec = hE + mE/60;
        schedule.push({ id: Date.now(), name: document.getElementById('fuv_name').value || "Course", day: parseInt(document.getElementById('fuv_day').value), startH: sDec, duration: eDec - sDec, room: document.getElementById('fuv_room').value || "N/A", info: "Môn FUV", color: generatePureRandomColor() });
        saveData(); render();
    }

    // --- PARSE TỪ STUDENT PORTAL ---
    const DAY_MAP = {
        'monday': 2, 'mon': 2, 'tuesday': 3, 'tue': 3, 'tues': 3,
        'wednesday': 4, 'wed': 4, 'thursday': 5, 'thu': 5, 'thur': 5, 'thurs': 5,
        'friday': 6, 'fri': 6, 'saturday': 7, 'sat': 7, 'sunday': 8, 'sun': 8
    };

    // Mã môn: 2-6 chữ cái, có/không khoảng trắng, 2-4 số, hậu tố tùy ý (a, A, L, 01...)
    // Bắt được: VS 214a, PSY 313, ARTS101, CORE 101, MATH101L, SOCI 323
    const CODE_RE = /^([A-Za-z]{2,6}\s?-?\s?\d{2,4}[A-Za-z0-9]{0,3})\s*[-–—:]\s*(.+)$/;

    function toggleManual() {
        const f = document.getElementById('manual_fields');
        const a = document.getElementById('manual_arrow');
        const open = f.style.display === 'none';
        f.style.display = open ? 'block' : 'none';
        a.textContent = open ? '▾' : '▸';
    }

    function setParseStatus(msg, type) {
        const el = document.getElementById('parse_status');
        el.className = 'parse-status' + (type ? ' ' + type : '');
        el.innerHTML = msg;
    }

    // Chuyển "8:00 AM", "16:45:00", "08:00" -> số thập phân (giờ)
    function parseTimeToDecimal(str) {
        if (!str) return null;
        const s = str.trim();
        const m = s.match(/^(\d{1,2})\s*:\s*(\d{2})(?:\s*:\s*\d{2})?\s*(AM|PM|am|pm)?$/);
        if (!m) return null;
        let h = parseInt(m[1], 10);
        const min = parseInt(m[2], 10);
        const ap = m[3] ? m[3].toUpperCase() : null;
        if (h > 23 || min > 59) return null;
        if (ap === 'PM' && h < 12) h += 12;
        if (ap === 'AM' && h === 12) h = 0;
        return h + min / 60;
    }

    // Tìm tên môn học trong đoạn text
    function extractCourseName(lines, raw) {
        // "Course\n<Tên>\nOffering Type"  -> lấy tên nằm giữa
        for (let i = 0; i < lines.length - 2; i++) {
            if (/^Course$/i.test(lines[i]) && /^Offering Type$/i.test(lines[i + 2])) {
                return lines[i + 1];
            }
        }
        // "Course\n<Tên>\nStart Date" (block đầu trang)
        for (let i = 0; i < lines.length - 2; i++) {
            if (/^Course$/i.test(lines[i]) && /^Start Date$/i.test(lines[i + 2])) {
                return lines[i + 1];
            }
        }
        // Format 1: dòng dạng "VS 214a - Developing Vietnam"
        for (const ln of lines) {
            const m = ln.match(CODE_RE);
            if (m) return m[2].trim();
        }
        // Fallback: dòng cuối "Course Offering: ARTS101_Fall2026_S01"
        const co = raw.match(/Course Offering:\s*([A-Za-z0-9_]+)/);
        if (co) return co[1];
        return null;
    }

    // Tìm mã môn (VD: VS 214a, PSY 313, ARTS101_Fall2026_S01)
    function extractCourseCode(lines, raw) {
        for (const ln of lines) {
            const m = ln.match(CODE_RE);
            if (m) return m[1].trim();
        }
        const co = raw.match(/Course Offering ID\s*\n\s*([A-Za-z0-9_]+)/);
        if (co) return co[1].split('_')[0];
        const co2 = raw.match(/Course Offering:\s*([A-Za-z0-9_]+)/);
        if (co2) return co2[1].split('_')[0];
        return '';
    }

    // Tìm tất cả các block lịch: {room, start, end, days[]}
    function extractSchedules(lines) {
        const results = [];
        for (let i = 0; i < lines.length; i++) {
            const t1 = parseTimeToDecimal(lines[i]);
            if (t1 === null) continue;
            const t2 = parseTimeToDecimal(lines[i + 1]);
            if (t2 === null) continue;
            const dayLine = lines[i + 2];
            if (!dayLine) continue;
            const days = parseDays(dayLine);
            if (days.length === 0) continue;
            // Phòng: dòng ngay trước giờ bắt đầu
            let room = lines[i - 1] || 'N/A';
            if (/^(Start Time|End Time|Schedule|Facility|Action|Navigation Mode)$/i.test(room)) room = 'N/A';
            if (parseTimeToDecimal(room) !== null) room = 'N/A';
            results.push({ room: room, startH: t1, endH: t2, days: days });
            i += 2;
        }
        return results;
    }

    // Cũng bắt được dòng gộp "8:00 AM - 9:30 AM - Classroom 7" (format 1)
    function extractInlineSchedule(lines) {
        for (const ln of lines) {
            const m = ln.match(/^(\d{1,2}:\d{2}\s*(?:AM|PM)?)\s*[-–—]\s*(\d{1,2}:\d{2}\s*(?:AM|PM)?)\s*[-–—]\s*(.+)$/i);
            if (m) {
                const s = parseTimeToDecimal(m[1]), e = parseTimeToDecimal(m[2]);
                if (s !== null && e !== null) return { room: m[3].trim(), startH: s, endH: e };
            }
        }
        return null;
    }

    function parseDays(line) {
        const found = [];
        const tokens = line.toLowerCase().split(/[,;/&]+|\s+and\s+/);
        for (let tk of tokens) {
            tk = tk.trim().replace(/[^a-z]/g, '');
            if (DAY_MAP[tk] && found.indexOf(DAY_MAP[tk]) === -1) found.push(DAY_MAP[tk]);
        }
        return found;
    }

    function generateFromPaste() {
        const raw = document.getElementById('fuv_paste').value;
        if (!raw.trim()) return setParseStatus('⚠️ Chưa có nội dung nào để đọc.', 'err');

        const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

        const name = extractCourseName(lines, raw);
        const code = extractCourseCode(lines, raw);
        let blocks = extractSchedules(lines);

        // Nếu bảng không có, thử dòng gộp + tìm dòng thứ riêng lẻ
        if (blocks.length === 0) {
            const inline = extractInlineSchedule(lines);
            if (inline) {
                for (const ln of lines) {
                    const d = parseDays(ln);
                    if (d.length > 0 && /,|and/i.test(ln + ',')) {
                        blocks.push({ room: inline.room, startH: inline.startH, endH: inline.endH, days: d });
                        break;
                    }
                }
            }
        }

        if (blocks.length === 0)
            return setParseStatus('❌ Không tìm thấy lịch học. Hãy chắc chắn bạn đã copy cả bảng <b>Course Offering Schedules</b> (Facility / Start Time / End Time / Schedule).', 'err');

        if (!name)
            return setParseStatus('❌ Đọc được giờ học nhưng không tìm ra tên môn. Bạn nhập tay tên môn giúp mình nha.', 'err');

        // Mỗi môn 1 màu chung, các buổi trong tuần dùng cùng màu
        const color = generatePureRandomColor();
        let added = 0, skipped = [];
        const detail = [];

        blocks.forEach(b => {
            const dur = b.endH - b.startH;
            if (dur <= 0) { skipped.push('Giờ kết thúc không hợp lệ'); return; }
            b.days.forEach(d => {
                if (isDuplicate(name, d, b.startH)) { skipped.push(dayName(d) + ' (đã có)'); return; }
                schedule.push({
                    id: Date.now() + Math.random(),
                    name: name,
                    day: d,
                    startH: b.startH,
                    duration: dur,
                    room: b.room,
                    info: code ? 'Môn FUV · ' + code : 'Môn FUV',
                    color: color
                });
                added++;
                detail.push(dayName(d) + ' ' + fmt(b.startH) + '–' + fmt(b.endH) + ' @ ' + b.room);
            });
        });

        saveData(); render();

        if (added === 0)
            return setParseStatus('⚠️ Không thêm buổi nào mới (có thể đã tồn tại trong lịch).', 'err');

        let msg = '✅ Đã thêm <b>' + name + '</b>' + (code ? ' (' + code + ')' : '') + ' — ' + added + ' buổi/tuần:<br>' + detail.join('<br>');
        if (skipped.length) msg += '<br><i style="color:#975a16">Bỏ qua: ' + skipped.join(', ') + '</i>';
        setParseStatus(msg, 'ok');
        document.getElementById('fuv_paste').value = '';
    }

    function isDuplicate(name, day, startH) {
        return schedule.some(s => s.name === name && s.day === day && Math.abs(s.startH - startH) < 0.01);
    }

    function dayName(d) { return ['','','T2','T3','T4','T5','T6','T7','CN'][d] || '?'; }
    function fmt(h) {
        const hh = Math.floor(h), mm = Math.round((h % 1) * 60);
        return hh + ':' + (mm < 10 ? '0' + mm : mm);
    }

    // --- LƯU TRỮ ---
    function addHoliday() {
        const s = document.getElementById('hol_start').value, e = document.getElementById('hol_end').value;
        if (!s || !e) return alert("Chọn ngày!");
        holidays.push({ id: Date.now(), start: s, end: e });
        localStorage.setItem('holiday_data', JSON.stringify(holidays));
        renderHolidays();
    }
    function removeHoliday(id) { holidays = holidays.filter(h => h.id !== id); localStorage.setItem('holiday_data', JSON.stringify(holidays)); renderHolidays(); }
    function renderHolidays() {
        const list = document.getElementById('hol_list');
        list.innerHTML = holidays.map(h => `<div class="holiday-tag">${h.start} → ${h.end} <span onclick="removeHoliday(${h.id})">×</span></div>`).join('');
    }
    function saveData() { localStorage.setItem('fuv_community_schedule', JSON.stringify(schedule)); }
    function saveDates() { localStorage.setItem('semester_dates', JSON.stringify({start: document.getElementById('sem_start').value, end: document.getElementById('sem_end').value})); }
    function loadData() {
        const s = localStorage.getItem('fuv_community_schedule'); if (s) schedule = JSON.parse(s);
        const d = localStorage.getItem('semester_dates'); if (d) { const o = JSON.parse(d); document.getElementById('sem_start').value = o.start; document.getElementById('sem_end').value = o.end; }
        const h = localStorage.getItem('holiday_data'); if (h) holidays = JSON.parse(h);
        render(); renderHolidays();
    }
    function resetSchedule() { if(confirm("Xóa sạch toàn bộ?")) { localStorage.clear(); location.reload(); } }
    function exportImg() { html2canvas(document.getElementById('captureRegion'), {scale: 2}).then(c => { const l = document.createElement('a'); l.download='Fulbright_Schedule.png'; l.href=c.toDataURL(); l.click(); }); }
    loadData();
</script>
